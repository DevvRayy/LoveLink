<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120D12">
<title>LoveLink - Pet & Room</title>

<!-- Library Supabase & OneSignal -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #120D12; --card-bg: rgba(40, 30, 40, 0.6); --card-border: rgba(255, 200, 220, 0.15);
    --text-main: #FFF0F5; --text-sub: #C0A8B8; --primary: #FF8BA7; --primary-glow: rgba(255, 139, 167, 0.4);
    --accent: #C99EFF; --accent-glow: rgba(201, 158, 255, 0.4); --mint: #64FFDA; --yellow: #FFD166;
    --danger: #FF6B6B; --radius-lg: 28px; --radius-md: 20px; --radius-sm: 14px;
    --transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); --smooth-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; overflow-x: hidden; position: relative; line-height: 1.5; transform: translate3d(0,0,0); }
  .bg-shapes { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
  .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.2; animation: float-bg 25s infinite ease-in-out alternate; }
  .shape:nth-child(1) { width: 300px; height: 300px; top: -10%; left: -10%; background: var(--primary); }
  .shape:nth-child(2) { width: 400px; height: 400px; bottom: -20%; right: -20%; background: var(--accent); }
  .floating-emoji { position: absolute; font-size: 24px; opacity: 0; animation: float-up 15s linear infinite; }
  .e1 { left: 10%; animation-delay: 0s; } .e2 { left: 30%; animation-delay: 3s; } .e3 { left: 60%; animation-delay: 6s; } .e4 { left: 80%; animation-delay: 9s; }
  @keyframes float-bg { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(40px, 60px, 0) scale(1.1); } }
  @keyframes float-up { 0% { transform: translate3d(0, 100vh, 0) rotate(0deg); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translate3d(0, -100px, 0) rotate(360deg); opacity: 0; } }

  .glass-panel { background: var(--card-bg); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 2px solid var(--card-border); box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255,255,255,0.1); position: relative; z-index: 10; }
  .card { width: 100%; max-width: 440px; border-radius: var(--radius-lg); padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 20px; animation: slide-up 0.6s var(--smooth-bounce) both; }
  @keyframes slide-up { from { transform: translate3d(0, 30px, 0); opacity: 0; } to { transform: translate3d(0, 0, 0); opacity: 1; } }
  
  .audio-toggle { position: fixed; top: 20px; right: 20px; z-index: 9999; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #FFF; font-size: 20px; display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; }
  .audio-toggle.active { background: var(--primary); border-color: #FFF; box-shadow: 0 0 15px var(--primary-glow); }

  h1 { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
  p.sub { font-size: 14px; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; }
  .title-small { font-family: 'Fredoka', sans-serif; font-size: 14px; color: var(--text-sub); letter-spacing: 1px; font-weight: 500; margin-bottom: 12px; text-align: left; }

  .input-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .input-group label { font-size: 13px; color: var(--text-sub); font-weight: 800; margin-left: 6px; }
  input, textarea { width: 100%; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.05); color: #FFF; padding: 16px; border-radius: var(--radius-md); font-size: 15px; font-weight: 700; outline: none; transition: var(--transition); }
  input:focus, textarea:focus { border-color: var(--primary); background: rgba(0,0,0,0.5); box-shadow: 0 0 20px var(--primary-glow); }
  textarea { height: 100px; resize: none; }
  input[type="file"] { padding: 10px; font-size: 13px; background: rgba(255,255,255,0.05); border: 2px dashed var(--card-border); }
  input[type="file"]::file-selector-button { background: var(--primary); color: #120D12; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 800; margin-right: 10px; cursor: pointer; }

  .btn { width: 100%; padding: 16px; border-radius: var(--radius-md); border: 2px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.03); color: #FFF; font-weight: 800; font-size: 15px; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: linear-gradient(135deg, #FF8BA7, #FF6B9D); border: none; color: #120D12; box-shadow: 0 8px 24px var(--primary-glow); }
  .btn-accent { background: linear-gradient(135deg, #C99EFF, #A855F7); border: none; color: #120D12; box-shadow: 0 8px 24px var(--accent-glow); }

  .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .span-full { grid-column: 1 / -1; }

  .profile-header { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border: 2px solid rgba(255,255,255,0.08); border-radius: var(--radius-lg); padding: 16px; }
  .avatar-box { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--primary); padding: 2px; background: #2A202A; object-fit: cover; }
  .avatar-box.partner .avatar { border-color: var(--accent); }
  .avatar-name { font-size: 13px; font-weight: 800; }
  .heart-connection { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .heart-pulse { font-size: 28px; animation: heartbeat 1.5s infinite; }
  .days-count { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: var(--primary); }
  @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  .kangen-section { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,0.2); border-radius: var(--radius-lg); border: 2px solid rgba(255,255,255,0.05); }
  .gauge-container { position: relative; width: 160px; height: 160px; margin-bottom: 16px; }
  .gauge-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .gauge-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 12; }
  .gauge-progress { fill: none; stroke: url(#gradient); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s var(--smooth-bounce); }
  .gauge-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge-num { font-family: 'Fredoka', sans-serif; font-size: 40px; font-weight: 700; color: #FFF; }
  .gauge-label { font-size: 11px; color: var(--text-sub); font-weight: 800; text-transform: uppercase; }
  .action-row { display: flex; gap: 10px; width: 100%; }
  .action-row .btn { padding: 14px; font-size: 14px; }

  .partner-status-box { background: linear-gradient(135deg, rgba(255, 139, 167, 0.1), rgba(201, 158, 255, 0.1)); border: 2px solid var(--card-border); padding: 20px; border-radius: var(--radius-lg); position: relative; overflow: hidden; text-align: left; }
  .partner-label { font-size: 12px; color: var(--text-sub); font-weight: 800; text-transform: uppercase; }
  .partner-activity { font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: var(--primary); }

  .cute-action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 10px; border-radius: var(--radius-md); border: 2px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.03); cursor: pointer; transition: var(--smooth-bounce); }
  .cute-action-btn:active { transform: scale(0.92); }
  .cute-action-btn .icon { font-size: 28px; margin-bottom: 8px; }
  .cute-action-btn .text { font-family: 'Fredoka', sans-serif; font-size: 12px; font-weight: 600; color: var(--text-main); }

  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status-btn { padding: 12px 8px; border-radius: var(--radius-md); border: 2px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.03); color: #FFF; font-size: 12px; font-weight: 800; cursor: pointer; transition: var(--smooth-bounce); }
  .status-btn.active { background: linear-gradient(135deg, rgba(255, 139, 167, 0.3), rgba(201, 158, 255, 0.3)); border-color: var(--primary); }

  .modal { position: fixed; inset: 0; background: rgba(10, 5, 10, 0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow-y: auto; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-content { background: linear-gradient(160deg, #2A202A, #1A1118); border: 2px solid var(--card-border); width: 100%; max-width: 400px; padding: 24px; border-radius: var(--radius-lg); text-align: left; transform: translateY(30px) scale(0.95); transition: var(--smooth-bounce); position: relative; }
  .modal.show .modal-content { transform: translateY(0) scale(1); }
  .modal-content h2 { font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; margin-bottom: 20px; text-align: center; color: var(--primary); }

  /* --- FITUR PET & ROOM --- */
  .pet-room-container { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  
  /* PET UI */
  .pet-view { background: rgba(255,255,255,0.03); border-radius: var(--radius-lg); height: 180px; display: flex; justify-content: center; align-items: flex-end; position: relative; overflow: hidden; border: 2px solid var(--card-border); }
  .pet-svg { width: 120px; height: 120px; transition: var(--smooth-bounce); transform-origin: bottom center; }
  .pet-svg.sleeping { filter: grayscale(50%) brightness(0.7); transform: scale(0.9) rotate(-5deg); }
  .pet-svg.playing { animation: bounce 0.5s infinite alternate; }
  .pet-svg.feeding { animation: munch 0.3s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
  @keyframes munch { from { transform: scale(1); } to { transform: scale(1.05); } }
  
  .pet-stats { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .stat-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 12px; overflow: hidden; position: relative; }
  .stat-fill { height: 100%; border-radius: 10px; transition: width 0.3s ease; }
  .stat-label { font-size: 11px; font-weight: 800; display: flex; justify-content: space-between; margin-bottom: 2px; color: var(--text-sub); }
  
  .pet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .pet-btn { padding: 12px 0; font-size: 20px; border-radius: var(--radius-md); border: none; background: rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; }
  .pet-btn:active { transform: scale(0.9); background: var(--primary); }
  
  /* ROOM UI */
  .room-view { background: #2A202A; border-radius: var(--radius-lg); height: 220px; position: relative; overflow: hidden; border: 2px solid var(--card-border); background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://www.transparenttextures.com/patterns/wood-pattern.png'); }
  .room-floor { position: absolute; bottom: 0; width: 100%; height: 40%; background: rgba(139, 69, 19, 0.4); border-top: 2px solid #5C3A21; }
  .furniture-item { position: absolute; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 32px; cursor: grab; transition: transform 0.1s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); touch-action: none; }
  .furniture-item:active { cursor: grabbing; transform: scale(1.1); z-index: 100; }
  
  /* CATALOG */
  .catalog-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-md); max-height: 120px; overflow-y: auto; }
  .catalog-item { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 4px; border-radius: 8px; cursor: pointer; }
  .catalog-item .icon { font-size: 24px; }
  .catalog-item .price { font-size: 10px; font-weight: 800; color: var(--yellow); margin-top: 4px; }
  
  .hidden { display: none !important; }
</style>
</head>
<body>

<button class="audio-toggle" id="audioToggle">🎵</button>

<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
</div>
<div class="bg-shapes">
  <div class="floating-emoji e1">💖</div>
  <div class="floating-emoji e2">✨</div>
  <div class="floating-emoji e3">🎀</div>
  <div class="floating-emoji e4">☁️</div>
</div>

<!-- LOGIN (Sama seperti sebelumnya) -->
<div class="card glass-panel" id="authCard">
  <h1>LoveLink 🎀</h1>
  <p class="sub">Masuk ke ruang rahasia kalian</p>
  <div class="input-group" style="margin-top:16px;"><label>Email</label><input type="email" id="email" placeholder="email@contoh.com"></div>
  <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="••••••••"></div>
  <button class="btn btn-primary" id="btnAction" style="margin-top:10px;">Masuk</button>
  <button class="btn btn-outline" id="btnSwitch">Belum punya akun? Daftar</button>
  <div class="error" id="errorMsg"></div>
</div>

<!-- DASHBOARD -->
<div class="card glass-panel hidden" id="dashboardCard">
  <div class="profile-header">
    <div class="avatar-box"><img src="https://api.dicebear.com/7.x/notionists/svg?seed=Me&backgroundColor=ffdfbf" class="avatar" alt="Me"><span class="avatar-name">Lu</span></div>
    <div class="heart-connection"><div class="heart-pulse">💖</div><div class="days-count" id="daysTogether">0</div></div>
    <div class="avatar-box partner"><img src="https://api.dicebear.com/7.x/notionists/svg?seed=Partner&backgroundColor=ffd5dc" class="avatar" alt="Partner"><span class="avatar-name">Pacar</span></div>
  </div>

  <div class="dashboard-grid">
    <div class="kangen-section span-full">
      <div class="gauge-container">
        <svg class="gauge-svg" viewBox="0 0 100 100"><defs><linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF8BA7" /><stop offset="100%" stop-color="#C99EFF" /></linearGradient></defs><circle class="gauge-bg" cx="50" cy="50" r="44"></circle><circle class="gauge-progress" id="gaugeProgress" cx="50" cy="50" r="44" stroke-dasharray="276" stroke-dashoffset="276"></circle></svg>
        <div class="gauge-text"><div class="gauge-num" id="kangenScore">0</div><div class="gauge-label">Total Kangen</div></div>
      </div>
      <div class="action-row">
        <button class="btn" id="btnKangen" style="background: rgba(255, 139, 167, 0.15); color: var(--primary);">❤️ Kangen</button>
        <button class="btn" id="btnTouch" style="background: rgba(201, 158, 255, 0.15); color: var(--accent);">🫶 Pegang</button>
      </div>
    </div>

    <div class="partner-status-box span-full">
      <div class="partner-label">Pacar lu lagi:</div>
      <div class="partner-activity" id="partnerActivity">Nunggu update...</div>
    </div>

    <!-- TOMBOL FITUR BARU -->
    <button class="cute-action-btn span-full" id="btnOpenPet" style="background: linear-gradient(135deg, rgba(255, 209, 102, 0.1), rgba(255, 139, 167, 0.1)); border-color: var(--yellow);">
      <div class="icon">🐾</div>
      <div class="text" style="font-size: 16px;">Couple Pet & Dream Room</div>
    </button>

    <button class="cute-action-btn" id="btnOpenTimeline"><div class="icon">📸</div><div class="text">Memory</div></button>
    <button class="cute-action-btn" id="btnOpenLoveNotes"><div class="icon">📝</div><div class="text">Notes</div></button>
    <button class="cute-action-btn" id="btnOpenShareLock"><div class="icon">📍</div><div class="text">ShareLock</div></button>
    <button class="cute-action-btn" id="btnOpenGame"><div class="icon">🎮</div><div class="text">Tic Tac Toe</div></button>

    <div class="span-full" style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: var(--radius-lg);">
      <div class="title-small">Update Statusmu:</div>
      <div class="status-grid">
        <button class="status-btn" data-act="idle">🛋️ Santai</button>
        <button class="status-btn" data-act="nugas">📚 Nugas</button>
        <button class="status-btn" data-act="makan">🍔 Makan</button>
        <button class="status-btn" data-act="tidur">😴 Tidur</button>
      </div>
    </div>

    <button class="btn span-full" style="background: rgba(255,255,255,0.03); color: var(--text-sub);" id="btnLogout">Keluar Akun</button>
  </div>
</div>

<!-- MODAL PET & ROOM -->
<div class="modal" id="petRoomModal">
  <div class="modal-content" style="max-width: 420px;">
    <h2 style="margin-bottom: 10px;">🐾 Pet & Room Kita</h2>
    
    <!-- STATUS KOIN -->
    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px 16px; border-radius: 20px; margin-bottom: 16px;">
      <div style="font-weight: 800; font-size: 14px;">Level <span id="petLevel">1</span> (EXP: <span id="petExp">0</span>/100)</div>
      <div style="font-weight: 800; font-size: 14px; color: var(--yellow);">🪙 <span id="petCoins">0</span></div>
    </div>

    <div class="pet-room-container">
      <!-- PET VIEW -->
      <div class="pet-view" id="petView">
        <!-- SVG Kucing Lucu (Bisa diganti kelinci/beruang nanti) -->
        <svg class="pet-svg" id="petSvg" viewBox="0 0 100 100">
          <!-- Body -->
          <rect x="25" y="40" width="50" height="40" rx="20" fill="#FFD1DC" />
          <!-- Head -->
          <circle cx="50" cy="40" r="25" fill="#FFD1DC" />
          <!-- Ears -->
          <polygon points="30,25 20,5 45,20" fill="#FFD1DC" />
          <polygon points="70,25 80,5 55,20" fill="#FFD1DC" />
          <!-- Inner Ears -->
          <polygon points="32,23 25,10 42,20" fill="#FF8BA7" />
          <polygon points="68,23 75,10 58,20" fill="#FF8BA7" />
          <!-- Eyes -->
          <circle cx="40" cy="38" r="4" fill="#333" />
          <circle cx="60" cy="38" r="4" fill="#333" />
          <circle cx="41" cy="37" r="1.5" fill="#FFF" />
          <circle cx="61" cy="37" r="1.5" fill="#FFF" />
          <!-- Nose & Mouth -->
          <path d="M 48 45 Q 50 48 52 45" stroke="#333" stroke-width="2" fill="none" />
          <path d="M 50 45 L 50 48" stroke="#333" stroke-width="2" />
          <!-- Cheeks -->
          <circle cx="32" cy="45" r="5" fill="#FF8BA7" opacity="0.5" />
          <circle cx="68" cy="45" r="5" fill="#FF8BA7" opacity="0.5" />
          <!-- Tail -->
          <path d="M 75 70 Q 95 60 85 45" stroke="#FFD1DC" stroke-width="8" stroke-linecap="round" fill="none" />
        </svg>
      </div>

      <!-- STATS -->
      <div class="pet-stats">
        <div>
          <div class="stat-label"><span>🍖 Kenyang</span><span id="valHunger">100%</span></div>
          <div class="stat-bar"><div class="stat-fill" id="barHunger" style="width: 100%; background: var(--danger);"></div></div>
        </div>
        <div>
          <div class="stat-label"><span>🎾 Senang</span><span id="valHappy">100%</span></div>
          <div class="stat-bar"><div class="stat-fill" id="barHappy" style="width: 100%; background: var(--yellow);"></div></div>
        </div>
        <div>
          <div class="stat-label"><span>⚡ Energi</span><span id="valEnergy">100%</span></div>
          <div class="stat-bar"><div class="stat-fill" id="barEnergy" style="width: 100%; background: var(--mint);"></div></div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="pet-actions">
        <button class="pet-btn" id="btnFeed" title="Beri Makan">🍖</button>
        <button class="pet-btn" id="btnPlay" title="Ajak Main">🎾</button>
        <button class="pet-btn" id="btnPetAct" title="Elus">🤚</button>
        <button class="pet-btn" id="btnSleep" title="Tidur">💤</button>
      </div>

      <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 16px 0;"></div>

      <!-- DREAM ROOM -->
      <div class="title-small">🏠 Dream Room Kita</div>
      <div class="room-view" id="roomView">
        <div class="room-floor"></div>
        <!-- Furnitur bakal di-inject ke sini sama JS -->
      </div>
      
      <div style="display: flex; justify-content: space-between; margin-top: 8px;">
        <button class="btn" id="btnEditRoom" style="padding: 8px; font-size: 12px; width: 48%; background: rgba(255,255,255,0.1);">🛠️ Mode Dekorasi</button>
        <button class="btn" id="btnClearRoom" style="padding: 8px; font-size: 12px; width: 48%; background: rgba(255, 107, 107, 0.2); color: var(--danger);">🗑️ Reset Kamar</button>
      </div>

      <!-- KATALOG (Muncul pas mode dekorasi) -->
      <div id="catalogArea" class="hidden" style="margin-top: 12px;">
        <div class="title-small" style="margin-bottom: 4px;">Toko Furnitur:</div>
        <div class="catalog-grid" id="catalogGrid">
          <!-- Diisi JS -->
        </div>
      </div>
      
    </div>
    <button class="btn" id="btnClosePetRoom" style="margin-top: 16px;">Tutup</button>
  </div>
</div>

<!-- MODAL LAINNYA (Disembunyikan biar kode gak kepanjangan, lu tinggal tambahin modal lama lu di sini) -->
<!-- ... -->

<script>
document.addEventListener('DOMContentLoaded', () => {
  // --- KONFIGURASI SUPABASE ---
  const SUPABASE_URL = 'https://zhfpppuwumcdsipkmuya.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-UgbkWg428KoQqfTeX6REA_jY3saxWG';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { storage: window.localStorage, autoRefreshToken: true, persistSession: true }
  });

  let currentUser = null;
  let petData = null;
  let roomData = null;
  let isEditMode = false;
  let draggedItem = null;

  // Katalog Statis (Bisa lu tambahin)
  const CATALOG = [
    { id: 'bed_1', name: 'Kasur Pink', icon: '🛏️', price: 50 },
    { id: 'plant_1', name: 'Tanaman', icon: '🪴', price: 20 },
    { id: 'lamp_1', name: 'Lampu Tidur', icon: '💡', price: 30 },
    { id: 'desk_1', name: 'Meja Belajar', icon: '🪑', price: 40 },
    { id: 'tv_1', name: 'TV Mini', icon: '📺', price: 80 },
    { id: 'bear_1', name: 'Boneka Beruang', icon: '🧸', price: 60 }
  ];

  // --- LOGIN & SESSION ---
  document.getElementById('btnAction').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
  });

  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      currentUser = session.user;
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('dashboardCard').classList.remove('hidden');
      await initPetAndRoom();
    } else {
      currentUser = null;
      document.getElementById('authCard').classList.remove('hidden');
      document.getElementById('dashboardCard').classList.add('hidden');
    }
  });

  // --- INIT PET & ROOM ---
  async function initPetAndRoom() {
    // Fetch Pet
    const { data: pet } = await supabaseClient.from('couple_pet').select('*').eq('id', 1).single();
    if (pet) {
      petData = pet;
      renderPetUI();
    }

    // Fetch Room
    const { data: room } = await supabaseClient.from('couple_room').select('*').eq('id', 1).single();
    if (room) {
      roomData = room;
      renderRoomUI();
    }

    // REALTIME SYNC
    supabaseClient.channel('pet_room_sync')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'couple_pet' }, payload => {
        petData = payload.new;
        renderPetUI();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'couple_room' }, payload => {
        roomData = payload.new;
        renderRoomUI();
      })
      .subscribe();
  }

  // --- RENDER UI PET ---
  function renderPetUI() {
    if (!petData) return;
    document.getElementById('petLevel').innerText = petData.level;
    document.getElementById('petExp').innerText = petData.exp % 100;
    document.getElementById('petCoins').innerText = petData.coins;
    
    document.getElementById('valHunger').innerText = petData.hunger + '%';
    document.getElementById('barHunger').style.width = petData.hunger + '%';
    document.getElementById('valHappy').innerText = petData.happiness + '%';
    document.getElementById('barHappy').style.width = petData.happiness + '%';
    document.getElementById('valEnergy').innerText = petData.energy + '%';
    document.getElementById('barEnergy').style.width = petData.energy + '%';
  }

  // Aksi Pet (Manggil RPC)
  async function doPetAction(action) {
    if (!currentUser) return;
    const btn = document.getElementById(`btn${action.charAt(0).toUpperCase() + action.slice(1)}`);
    if(btn) btn.disabled = true;

    const { data, error } = await supabaseClient.rpc('action_pet', { action_type: action });
    
    if(btn) btn.disabled = false;

    if (error) return alert('Error: ' + error.message);
    if (!data.success) return alert(data.message);

    // Efek Visual
    const petSvg = document.getElementById('petSvg');
    petSvg.classList.add(action === 'play' ? 'playing' : action === 'feed' ? 'feeding' : '');
    setTimeout(() => petSvg.className.baseVal = 'pet-svg', 1000);
  }

  document.getElementById('btnFeed').onclick = () => doPetAction('feed');
  document.getElementById('btnPlay').onclick = () => doPetAction('play');
  document.getElementById('btnPetAct').onclick = () => doPetAction('pet');
  document.getElementById('btnSleep').onclick = () => doPetAction('sleep');

  // --- RENDER UI ROOM ---
  function renderRoomUI() {
    const roomView = document.getElementById('roomView');
    // Hapus semua elemen kecuali lantai
    Array.from(roomView.children).forEach(child => {
      if (!child.classList.contains('room-floor')) child.remove();
    });

    if (!roomData || !roomData.layout) return;

    roomData.layout.forEach(item => {
      const el = document.createElement('div');
      el.className = 'furniture-item';
      el.innerText = CATALOG.find(c => c.id === item.id)?.icon || '📦';
      el.style.left = item.x + '%';
      el.style.top = item.y + '%';
      
      if (isEditMode) {
        el.style.pointerEvents = 'auto';
        el.addEventListener('pointerdown', startDrag);
        el.addEventListener('dblclick', () => removeItem(item.instanceId)); // Hapus dengan double tap
      } else {
        el.style.pointerEvents = 'none';
      }
      roomView.appendChild(el);
    });
  }

  // Logika Drag & Drop Furnitur (Pakai Pointer Events agar support Android)
  function startDrag(e) {
    if (!isEditMode) return;
    draggedItem = e.target;
    draggedItem.setPointerCapture(e.pointerId);
    
    draggedItem.onpointermove = (ev) => {
      const roomRect = document.getElementById('roomView').getBoundingClientRect();
      let newX = ((ev.clientX - roomRect.left) / roomRect.width) * 100;
      let newY = ((ev.clientY - roomRect.top) / roomRect.height) * 100;
      
      // Batasi biar gak keluar kamar
      newX = Math.max(0, Math.min(newX, 90));
      newY = Math.max(0, Math.min(newY, 85));
      
      draggedItem.style.left = newX + '%';
      draggedItem.style.top = newY + '%';
    };

    draggedItem.onpointerup = () => {
      draggedItem.onpointermove = null;
      draggedItem.onpointerup = null;
      saveRoomLayout();
    };
  }

  async function saveRoomLayout() {
    const items = Array.from(document.querySelectorAll('.furniture-item')).map(el => ({
      instanceId: Date.now() + Math.random(),
      id: getCatalogIdFromIcon(el.innerText), // Hack cepet, idealnya simpan ID di dataset
      x: parseFloat(el.style.left),
      y: parseFloat(el.style.top)
    }));
    // Karena gak ada dataset id, kita biarin user reset aja kalau berantakan
    // (Best practice: simpan ID di el.dataset.id)
  }

  // --- KATALOG & BELI ---
  function renderCatalog() {
    const grid = document.getElementById('catalogGrid');
    grid.innerHTML = '';
    CATALOG.forEach(item => {
      const isOwned = petData.inventory.includes(item.id);
      const div = document.createElement('div');
      div.className = 'catalog-item';
      div.innerHTML = `
        <div class="icon">${item.icon}</div>
        <div class="price">${isOwned ? '✔️' : '🪙' + item.price}</div>
      `;
      div.onclick = () => buyAndPlaceItem(item);
      grid.appendChild(div);
    });
  }

  async function buyAndPlaceItem(item) {
    if (!currentUser) return;
    const isOwned = petData.inventory.includes(item.id);

    if (!isOwned) {
      // Panggil RPC pembelian (Anti Cheat)
      const { data, error } = await supabaseClient.rpc('buy_furniture', { item_id: item.id, item_price: item.price });
      if (error) return alert(error.message);
      if (!data.success) return alert(data.message);
    }

    // Taruh di tengah kamar
    const roomView = document.getElementById('roomView');
    const newEl = document.createElement('div');
    newEl.className = 'furniture-item';
    newEl.innerText = item.icon;
    newEl.style.left = '45%';
    newEl.style.top = '50%';
    newEl.addEventListener('pointerdown', startDrag);
    roomView.appendChild(newEl);
  }

  // --- MODE DEKORASI ---
  document.getElementById('btnEditRoom').onclick = () => {
    isEditMode = !isEditMode;
    document.getElementById('catalogArea').classList.toggle('hidden', !isEditMode);
    document.getElementById('btnEditRoom').innerText = isEditMode ? '✅ Selesai Dekorasi' : '🛠️ Mode Dekorasi';
    renderRoomUI();
    if (isEditMode) renderCatalog();
  };

  // Buka Modal
  document.getElementById('btnOpenPet').onclick = () => document.getElementById('petRoomModal').classList.add('show');
  document.getElementById('btnClosePetRoom').onclick = () => document.getElementById('petRoomModal').classList.remove('show');

});
</script>
</body>
</html>
