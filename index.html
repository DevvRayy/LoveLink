<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveLink - Bucket List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body {
    background: linear-gradient(135deg, #1A0B14 0%, #2A1420 100%);
    color: #FCF0F5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    overflow-x: hidden;
  }
  .card {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 182, 210, 0.15);
    border-radius: 20px; padding: 25px 20px; width: 100%; max-width: 400px;
    backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center;
    position: relative; z-index: 10;
  }
  h1 { font-size: 24px; color: #FF7FA8; margin-bottom: 5px; }
  p.sub { font-size: 12px; color: #C9A0B8; margin-bottom: 20px; }
  
  input, textarea {
    width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,182,210,0.2);
    color: #FFF; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none;
    font-family: inherit;
  }
  textarea { height: 100px; resize: none; }
  .btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #FF7FA8, #C99EFF); color: #2A0018;
    font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-outline { background: transparent; border: 1px solid #FF7FA8; color: #FF7FA8; margin-top: 12px; }
  .error { color: #FF6B6B; font-size: 12px; margin-top: 12px; min-height: 18px; }
  .hidden { display: none !important; }

  /* DASHBOARD UI */
  .my-status-box, .action-box {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 15px; border-radius: 15px; margin-bottom: 15px;
  }
  .title-small { font-size: 11px; color: #C9A0B8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: left;}
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status-btn {
    padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2); color: #FFF; font-size: 12px; cursor: pointer; transition: 0.2s;
  }
  .status-btn.active { background: linear-gradient(135deg, rgba(255,127,168,0.3), rgba(201,158,255,0.3)); border-color: #FF7FA8; font-weight: 700; }
  
  .kangen-display { font-size: 30px; font-weight: 800; color: #FF7FA8; margin: 10px 0; }
  .btn-kangen { background: linear-gradient(135deg, #FF7FA8, #FF4D6D); color: #FFF; width: 100%; box-shadow: 0 4px 15px rgba(255,77,109,0.3); margin-bottom: 8px;}
  .btn-touch { background: linear-gradient(135deg, #C99EFF, #8A2BE2); color: #FFF; width: 100%; box-shadow: 0 4px 15px rgba(138,43,226,0.3); }

  .partner-status-box {
    background: linear-gradient(135deg, rgba(255,127,168,0.1), rgba(201,158,255,0.05));
    border: 1px dashed #FF7FA8; padding: 20px 15px; border-radius: 15px; margin-bottom: 15px;
    position: relative; overflow: hidden;
  }
  .partner-label { font-size: 11px; color: #C9A0B8; margin-bottom: 8px; text-align: left;}
  .partner-activity { font-size: 18px; font-weight: 700; color: #FF7FA8; z-index: 2; position: relative; text-align: left;}

  /* MODAL GENERAL */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s; overflow-y: auto;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #2A1420; width: 100%; max-width: 380px; padding: 20px; border-radius: 20px;
    border: 1px solid rgba(255,127,168,0.3); text-align: left;
  }

  /* RODA PUTAR */
  .wheel-container { position: relative; width: 250px; height: 250px; margin: 0 auto 20px; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #1A0B14; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(#FF7FA8 0deg 45deg, #C99EFF 45deg 90deg, #64FFDA 90deg 135deg, #FFD166 135deg 180deg, #FF6B6B 180deg 225deg, #4CAF50 225deg 270deg, #00B4D8 270deg 315deg, #E8C76A 315deg 360deg); }
  .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #FFF; z-index: 2; }
  .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #2A1420; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
  .result-text { font-size: 16px; font-weight: 800; color: #FFF; text-align: center; background: rgba(255,127,168,0.2); padding: 15px; border-radius: 15px; margin-bottom: 20px; min-height: 60px; display: flex; align-items: center; justify-content: center; }

  /* TIME CAPSULE UI */
  .letter-item {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: left;
  }
  .letter-item.locked { border-color: rgba(255,107,120,0.4); background: rgba(255,107,120,0.05); }
  .letter-date { font-size: 11px; color: #C9A0B8; margin-bottom: 5px; }
  .letter-content { font-size: 14px; color: #FFF; line-height: 1.6; white-space: pre-wrap; }
  .letter-lock-msg { font-size: 13px; color: #FF6B6B; font-weight: 600; text-align: center; margin-top: 10px; }

  /* BUCKET LIST UI */
  .bucket-item {
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05);
    padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.2s;
  }
  .bucket-item.done { opacity: 0.6; background: rgba(100, 255, 218, 0.05); border-color: rgba(100,255,218,0.3); }
  .bucket-checkbox {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #C99EFF;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0; color: transparent; font-size: 12px;
  }
  .bucket-item.done .bucket-checkbox { background: #64FFDA; border-color: #64FFDA; color: #1A0B14; }
  .bucket-text { flex: 1; font-size: 14px; color: #FFF; text-align: left; }
  .bucket-item.done .bucket-text { text-decoration: line-through; color: #C9A0B8; }
  .bucket-delete { background: transparent; border: none; color: #FF6B6B; cursor: pointer; font-size: 16px; padding: 5px; }

  /* ANIMASI HATI */
  .heart { position: fixed; font-size: 24px; pointer-events: none; z-index: 999; animation: fallUp 2s linear forwards; }
  @keyframes fallUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-150px) scale(1.5); opacity: 0; } }
</style>
</head>
<body>

<!-- LAYAR LOGIN -->
<div class="card" id="authCard">
  <h1>LoveLink 💌</h1>
  <p class="sub" id="subtitle">Masuk ke ruang rahasia kalian</p>
  <input type="email" id="email" placeholder="Alamat Email">
  <input type="password" id="password" placeholder="Password">
  <button class="btn" id="btnAction">Masuk</button>
  <button class="btn btn-outline" id="btnSwitch">Belum punya akun? Daftar</button>
  <div class="error" id="errorMsg"></div>
</div>

<!-- LAYAR DASHBOARD -->
<div class="card hidden" id="dashboardCard">
  <h1>LoveLink 💌</h1>
  <p class="sub">Real-time Connection</p>
  
  <div class="partner-status-box">
    <div class="partner-label">Pacar lu lagi:</div>
    <div class="partner-activity" id="partnerActivity">Nunggu update...</div>
  </div>

  <div class="action-box" style="text-align:center;">
    <div class="title-small" style="text-align:center;">Total Kangen Kalian</div>
    <div class="kangen-display" id="kangenScore">0</div>
    <button class="btn btn-kangen" id="btnKangen">❤️ Aku Kangen Kamu</button>
    <button class="btn btn-touch" id="btnTouch">🫶 Pegang Tanganku</button>
    
    <!-- TOMBOL FITUR BARU -->
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button class="btn btn-primary" id="btnSpin" style="margin-top:0; flex:1; font-size:11px; padding: 10px 5px;">🎡 Tantangan</button>
      <button class="btn btn-outline" id="btnOpenCapsule" style="margin-top:0; flex:1; font-size:11px; padding: 10px 5px; border-color:#C99EFF; color:#C99EFF;">📜 Surat</button>
      <button class="btn btn-outline" id="btnOpenBucket" style="margin-top:0; flex:1; font-size:11px; padding: 10px 5px; border-color:#FFD166; color:#FFD166;">🎯 Bucket List</button>
    </div>
  </div>

  <div class="my-status-box">
    <div class="title-small">Update Statusmu:</div>
    <div class="status-grid">
      <button class="status-btn" data-act="idle">🛋️ Santai</button>
      <button class="status-btn" data-act="motor">🏍️ Naik Motor</button>
      <button class="status-btn" data-act="nugas">📚 Lagi Nugas</button>
      <button class="status-btn" data-act="tidur">😴 Tidur</button>
    </div>
  </div>
  
  <button class="btn" style="background:rgba(255,100,100,0.15); color:#FF6B6B; border:1px solid rgba(255,100,100,0.3);" id="btnLogout">Logout</button>
</div>

<!-- MODAL SPIN THE WHEEL -->
<div class="modal" id="spinModal">
  <div class="modal-content">
    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="wheel-center">🎯</div>
    </div>
    <div class="result-text" id="spinResult">Tekan tombol di bawah untuk memutar!</div>
    <button class="btn btn-primary" id="btnDoSpin">Putar Sekarang!</button>
    <button class="btn btn-outline" id="btnCloseSpin" style="border-color: #FFF; color: #FFF;">Tutup</button>
  </div>
</div>

<!-- MODAL TIME CAPSULE (SURAT WAKTU) -->
<div class="modal" id="capsuleModal">
  <div class="modal-content">
    <h2 style="color:#C99EFF; font-size:18px; margin-bottom:15px; text-align:center;">📜 Surat Masa Depan</h2>
    
    <div id="capsuleForm">
      <textarea id="capsuleText" placeholder="Tulis surat panjang buat pacar lu di sini..."></textarea>
      <label style="font-size:12px; color:#C9A0B8; display:block; margin-bottom:5px;">Tanggal Buka Surat:</label>
      <input type="date" id="capsuleDate">
      <button class="btn" id="btnSendCapsule" style="margin-top:10px; background:linear-gradient(135deg, #C99EFF, #8A2BE2); color:#FFF;">Kirim & Kunci Surat</button>
    </div>

    <div style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
      <h3 style="font-size:14px; margin-bottom:10px; color:#FFF;">📬 Kotak Masuk Surat</h3>
      <div id="capsuleList" style="max-height: 200px; overflow-y: auto;"></div>
    </div>
    
    <button class="btn btn-outline" id="btnCloseCapsule" style="border-color: #FFF; color: #FFF;">Tutup</button>
  </div>
</div>

<!-- MODAL BUCKET LIST -->
<div class="modal" id="bucketModal">
  <div class="modal-content">
    <h2 style="color:#FFD166; font-size:18px; margin-bottom:15px; text-align:center;">🎯 Bucket List Kita</h2>
    
    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
      <input type="text" id="bucketInput" placeholder="Mau ngapain pas ketemu nanti?" style="margin-bottom:0;">
      <button class="btn" id="btnAddBucket" style="width: auto; margin-top:0; padding: 0 15px; background: #FFD166; color: #1A0B14;">+</button>
    </div>

    <div id="bucketListContainer" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
      <!-- List bakal muncul di sini -->
    </div>
    
    <button class="btn btn-outline" id="btnCloseBucket" style="border-color: #FFF; color: #FFF;">Tutup</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const SUPABASE_URL = 'https://zhfpppuwumcdsipkmuya.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-UgbkWg428KoQqfTeX6REA_jY3saxWG';
  const ONESIGNAL_APP_ID = 'os_v2_app_xqjr3oxewvgc3aur7gsuoyb3slcblvsacm4e5uvmyregnzyvum3gydrqzlsdtzrgvo3res5bci3vr6sldjc4jmkk2u5y2iqvi423fey';
  const ONESIGNAL_REST_API_KEY = 'bc131dba-e4b5-4c2d-8291-f9a547603b92';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: ONESIGNAL_APP_ID });
    await OneSignal.Slidedown.promptPush(); 
  });

  // Elemen UI
  const authCard = document.getElementById('authCard');
  const dashboardCard = document.getElementById('dashboardCard');
  const btnAction = document.getElementById('btnAction');
  const btnSwitch = document.getElementById('btnSwitch');
  const btnLogout = document.getElementById('btnLogout');
  const errorEl = document.getElementById('errorMsg');
  const partnerActivity = document.getElementById('partnerActivity');
  const kangenScoreEl = document.getElementById('kangenScore');
  
  // Elemen Spin
  const spinModal = document.getElementById('spinModal');
  const wheel = document.getElementById('wheel');
  const btnSpin = document.getElementById('btnSpin');
  const btnDoSpin = document.getElementById('btnDoSpin');
  const btnCloseSpin = document.getElementById('btnCloseSpin');
  const spinResult = document.getElementById('spinResult');

  // Elemen Time Capsule
  const capsuleModal = document.getElementById('capsuleModal');
  const btnOpenCapsule = document.getElementById('btnOpenCapsule');
  const btnCloseCapsule = document.getElementById('btnCloseCapsule');
  const btnSendCapsule = document.getElementById('btnSendCapsule');
  const capsuleText = document.getElementById('capsuleText');
  const capsuleDate = document.getElementById('capsuleDate');
  const capsuleList = document.getElementById('capsuleList');

  // Elemen Bucket List
  const bucketModal = document.getElementById('bucketModal');
  const btnOpenBucket = document.getElementById('btnOpenBucket');
  const btnCloseBucket = document.getElementById('btnCloseBucket');
  const btnAddBucket = document.getElementById('btnAddBucket');
  const bucketInput = document.getElementById('bucketInput');
  const bucketListContainer = document.getElementById('bucketListContainer');

  let isLoginMode = true;
  let currentUser = null;
  let isSpinning = false;
  
  let lastSpinId = 0;
  let lastPartnerScore = 0;

  const challenges = [
    "Kirim Pap 3 kali 📸",
    "Kirim Vn I Love You 🎙",
    "Bilang 'Aku Sayang Kamu' 3x 😻",
    "Panggil Pacar Pake Nama Lucu🐣",
    "Kirim Foto Selfie Di Posisi Sekarang  📸",
    "Teken Tombol Aku Kangen Kamu 💗",
    "Pelukan Virtual 10 Detik 🫂",
    "Tukeran Wallpaper 1 Hari 🖼️"
  ];

  // --- LOGIN LOGIC ---
  btnSwitch.addEventListener('click', () => {
    isLoginMode = !isLoginMode;
    errorEl.innerText = '';
    btnAction.innerText = isLoginMode ? 'Masuk' : 'Daftar Akun Baru';
    btnSwitch.innerText = isLoginMode ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk';
  });

  btnAction.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errorEl.innerText = '';
    if (!email || !password) return errorEl.innerText = 'Isi email & password!';

    btnAction.innerText = 'Memproses...'; btnAction.disabled = true;
    try {
      if (isLoginMode) {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) btnSwitch.click();
      }
    } catch (err) { errorEl.innerText = err.message; } 
    finally {
      btnAction.innerText = isLoginMode ? 'Masuk' : 'Daftar Akun Baru';
      btnAction.disabled = false;
    }
  });

  btnLogout.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    if (window.statusChannel) supabaseClient.removeChannel(window.statusChannel);
    if (window.bucketChannel) supabaseClient.removeChannel(window.bucketChannel);
  });

  // --- AKSI STATUS & KANGEN & TOUCH ---
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!currentUser) return;
      const act = btn.getAttribute('data-act');
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await supabaseClient.from('user_status').upsert({ id: currentUser.id, activity: act });
      sendPushToPartner('Pacar lu sekarang: ' + getActivityLabel(act));
    });
  });

  document.getElementById('btnKangen').addEventListener('click', async () => {
    if (!currentUser) return;
    const { data } = await supabaseClient.from('user_status').select('kangen_score').eq('id', currentUser.id).single();
    const newScore = (data?.kangen_score || 0) + 1;
    await supabaseClient.from('user_status').update({ kangen_score: newScore }).eq('id', currentUser.id);
    kangenScoreEl.innerText = parseInt(kangenScoreEl.innerText) + 1;
    spawnHearts(5);
    sendPushToPartner('Pacar lu ngirim Kangen ❤️');
  });

  document.getElementById('btnTouch').addEventListener('click', async () => {
    if (!currentUser) return;
    navigator.vibrate([200, 100, 200]);
    sendPushToPartner('Pacar lu ngajak Pegang Tangan 🫶');
  });

  // --- SPIN THE WHEEL LOGIC ---
  btnSpin.addEventListener('click', () => {
    spinModal.classList.add('show');
    spinResult.innerText = "Tekan tombol di bawah untuk memutar!";
    wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)';
  });
  btnCloseSpin.addEventListener('click', () => spinModal.classList.remove('show'));

  btnDoSpin.addEventListener('click', async () => {
    if (isSpinning) return;
    isSpinning = true; btnDoSpin.disabled = true; btnDoSpin.innerText = "Memutar...";

    const randomIndex = Math.floor(Math.random() * challenges.length);
    const resultTeks = challenges[randomIndex];
    
    const spinId = Date.now();
    const spinData = resultTeks + '|' + spinId; 

    await supabaseClient.from('user_status').update({ spin_result: spinData }).eq('id', currentUser.id);
    sendPushToPartner('Pacar lu muter roda tantangan! 🎡');
    animateWheelTo(randomIndex, resultTeks);
  });

  function animateWheelTo(index, resultTeks) {
    const segmentAngle = 360 / challenges.length;
    const targetDeg = (360 * 5) + (360 - (index * segmentAngle) - (segmentAngle / 2)); 
    wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
    wheel.style.transform = `rotate(${targetDeg}deg)`;

    setTimeout(() => {
      spinResult.innerHTML = `Tantangannya:<br><span style="color:#64FFDA">${resultTeks}</span>`;
      navigator.vibrate([100, 50, 100]);
      isSpinning = false; btnDoSpin.disabled = false; btnDoSpin.innerText = "Putar Lagi!";
    }, 4200);
  }

  // --- TIME CAPSULE LOGIC ---
  btnOpenCapsule.addEventListener('click', async () => {
    capsuleModal.classList.add('show');
    capsuleText.value = ''; capsuleDate.value = '';
    await loadCapsules();
  });
  btnCloseCapsule.addEventListener('click', () => capsuleModal.classList.remove('show'));

  btnSendCapsule.addEventListener('click', async () => {
    const text = capsuleText.value.trim();
    const date = capsuleDate.value;
    
    if (!text) return alert('Tulis suratnya dulu bro!');
    if (!date) return alert('Pilih tanggal buka suratnya!');
    
    const todayObj = new Date();
    const todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth() + 1).padStart(2, '0') + '-' + String(todayObj.getDate()).padStart(2, '0');
    if (date < todayStr) return alert('Tanggal tidak boleh masa lalu!');

    btnSendCapsule.innerText = 'Mengunci...'; btnSendCapsule.disabled = true;

    const { error } = await supabaseClient.from('time_capsules').insert({
      sender_id: currentUser.id, sender_email: currentUser.email, content: text, unlock_date: date
    });

    btnSendCapsule.innerText = 'Kirim & Kunci Surat'; btnSendCapsule.disabled = false;

    if (error) {
      alert('Gagal ngirim surat: ' + error.message);
    } else {
      alert('Surat berhasil dikunci! Bakal kebuka otomatis tanggal ' + date);
      capsuleText.value = ''; capsuleDate.value = '';
      sendPushToPartner('Pacar lu ngirim Surat Masa Depan! 📜');
      await loadCapsules(); 
    }
  });

  async function loadCapsules() {
    capsuleList.innerHTML = '<div style="text-align:center; font-size:12px; color:#C9A0B8;">Memuat surat...</div>';
    const { data, error } = await supabaseClient.from('time_capsules').select('*').neq('sender_id', currentUser.id).order('created_at', { ascending: false });

    if (error || data.length === 0) {
      capsuleList.innerHTML = '<div style="text-align:center; font-size:12px; color:#C9A0B8;">Belum ada surat masuk.</div>';
      return;
    }

    capsuleList.innerHTML = '';
    const todayObj = new Date();
    const todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth() + 1).padStart(2, '0') + '-' + String(todayObj.getDate()).padStart(2, '0');

    data.forEach(letter => {
      const isLocked = todayStr < letter.unlock_date;
      const dateObj = new Date(letter.unlock_date);
      const dateStr = dateObj.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });

      const div = document.createElement('div');
      div.className = `letter-item ${isLocked ? 'locked' : ''}`;
      
      if (isLocked) {
        div.innerHTML = `
          <div class="letter-date">Dikirim oleh: ${letter.sender_email}</div>
          <div class="letter-content" style="filter: blur(5px); user-select: none;">Isi surat masih rahasia ya sayang...</div>
          <div class="letter-lock-msg">🔒 Terkunci hingga ${dateStr}</div>
        `;
      } else {
        div.innerHTML = `
          <div class="letter-date">Dibuka pada: ${dateStr}</div>
          <div class="letter-content">${letter.content}</div>
        `;
      }
      capsuleList.appendChild(div);
    });
  }

  // --- BUCKET LIST LOGIC ---
  btnOpenBucket.addEventListener('click', async () => {
    bucketModal.classList.add('show');
    bucketInput.value = '';
    await loadBucketList();
  });
  btnCloseBucket.addEventListener('click', () => bucketModal.classList.remove('show'));

  btnAddBucket.addEventListener('click', async () => {
    const content = bucketInput.value.trim();
    if (!content) return;

    bucketInput.value = ''; // Clear input immediately
    await supabaseClient.from('bucket_list').insert({
      content: content,
      added_by: currentUser.id
    });
    sendPushToPartner('Pacar lu nambahin bucket list baru! 🎯');
  });

  async function loadBucketList() {
    const { data, error } = await supabaseClient.from('bucket_list').select('*').order('created_at', { ascending: true });
    if (error) return;
    renderBucketList(data);
  }

  function renderBucketList(data) {
    bucketListContainer.innerHTML = '';
    if (data.length === 0) {
      bucketListContainer.innerHTML = '<div style="text-align:center; font-size:12px; color:#C9A0B8; padding:10px;">Belum ada rencana. Yuk tambahin!</div>';
      return;
    }

    data.forEach(item => {
      const div = document.createElement('div');
      div.className = `bucket-item ${item.is_completed ? 'done' : ''}`;
      
      const isMe = item.added_by === currentUser.id;
      const badge = isMe ? ' (Lu)' : ' (Pacar)';

      div.innerHTML = `
        <div class="bucket-checkbox" onclick="toggleBucket('${item.id}', ${item.is_completed})">✓</div>
        <div class="bucket-text">${item.content}<span style="font-size:10px; color:#C99EFF;">${badge}</span></div>
        <button class="bucket-delete" onclick="deleteBucket('${item.id}')">✕</button>
      `;
      bucketListContainer.appendChild(div);
    });
  }

  window.toggleBucket = async (id, currentStatus) => {
    await supabaseClient.from('bucket_list').update({ is_completed: !currentStatus }).eq('id', id);
    sendPushToPartner(!currentStatus ? 'Pacar lu nyentang bucket list! 🎉' : 'Bucket list dibatalin centangnya 😅');
  };

  window.deleteBucket = async (id) => {
    if(!confirm('Hapus rencana ini?')) return;
    await supabaseClient.from('bucket_list').delete().eq('id', id);
  };

  // --- FUNGSI PENDUKUNG ---
  function getActivityLabel(act) {
    const labels = { 'idle': 'Lagi Santai', 'motor': 'Lagi Naik Motor', 'nugas': 'Lagi Nugas', 'tidur': 'Lagi Tidur' };
    return labels[act] || act;
  }

  function spawnHearts(count) {
    for(let i=0; i<count; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart'; heart.innerText = '❤️';
        heart.style.left = (Math.random() * 80 + 10) + '%';
        heart.style.bottom = (Math.random() * 20 + 10) + '%';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2000);
      }, i * 150);
    }
  }

  async function sendPushToPartner(pesan) {
    try {
      const { data: partnerData } = await supabaseClient.from('profiles').select('onesignal_id').neq('id', currentUser.id).not('onesignal_id', 'is', null).limit(1).single();
      if (!partnerData || !partnerData.onesignal_id) return;
      fetch('https://onesignal.com/api/v1/notifications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + ONESIGNAL_REST_API_KEY },
        body: JSON.stringify({ app_id: ONESIGNAL_APP_ID, include_player_ids: [partnerData.onesignal_id], headings: { en: 'LoveLink 💌' }, contents: { en: pesan } })
      });
    } catch (err) {}
  }

  // --- SESSION & REALTIME ---
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      currentUser = session.user;
      authCard.classList.add('hidden');
      dashboardCard.classList.remove('hidden');

      const { data: myData } = await supabaseClient.from('user_status').select('*').eq('id', currentUser.id).single();
      const { data: partnerData } = await supabaseClient.from('user_status').select('*').neq('id', currentUser.id).limit(1).single();
      
      let totalKangen = (myData?.kangen_score || 0) + (partnerData?.kangen_score || 0);
      kangenScoreEl.innerText = totalKangen;
      lastPartnerScore = partnerData?.kangen_score || 0;

      if (partnerData && partnerData.spin_result) {
          const parts = partnerData.spin_result.split('|');
          lastSpinId = parseInt(parts[1] || 0);
      }

      OneSignalDeferred.push(async function(OneSignal) {
        const playerId = await OneSignal.getUserId();
        if (playerId) await supabaseClient.from('profiles').update({ onesignal_id: playerId }).eq('id', currentUser.id);
      });

      // REALTIME: User Status (Kangen, Spin, Activity)
      window.statusChannel = supabaseClient.channel('realtime_status')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'user_status' }, payload => {
          const newData = payload.new;
          
          if (newData.id !== currentUser.id) {
            if (newData.kangen_score !== undefined && newData.kangen_score > lastPartnerScore) {
                lastPartnerScore = newData.kangen_score;
                kangenScoreEl.innerText = parseInt(kangenScoreEl.innerText) + 1;
                spawnHearts(3);
            }
            if (newData.spin_result) {
               const parts = newData.spin_result.split('|');
               const teks = parts[0];
               const receivedSpinId = parseInt(parts[1] || 0);
               if (receivedSpinId > lastSpinId) {
                 lastSpinId = receivedSpinId;
                 const index = challenges.indexOf(teks);
                 if (index !== -1) {
                   spinModal.classList.add('show');
                   spinResult.innerText = "Pacar lu muter rodanya!";
                   setTimeout(() => { animateWheelTo(index, teks); }, 500);
                 }
               }
            }
          }
        })
        .subscribe();

      // REALTIME: Bucket List
      window.bucketChannel = supabaseClient.channel('realtime_bucket')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bucket_list' }, async () => {
          // Kalau ada perubahan apa pun (tambah, centang, hapus), langsung tarik data terbaru
          if (bucketModal.classList.contains('show')) {
             await loadBucketList();
          }
        })
        .subscribe();

    } else {
      currentUser = null;
      authCard.classList.remove('hidden');
      dashboardCard.classList.add('hidden');
    }
  });
});
</script>
</body>
</html>
